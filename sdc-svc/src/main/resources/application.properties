server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
spring.application.name=sdc-svc

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Viewer cache configuration
# Número de blocos 3D decomprimidos a manter em cache LRU
# Cada bloco pode ter tamanho variável, mas tipicamente ocupa
# (inlineSize * xlineSize * timeSize * 4 bytes) de RAM.
# Ex: 8x8x1000 float = 256KB por bloco, 64 blocos = 16MB
sdc.viewer.cache-blocks=64