<div class="file-upload">
  <label for="filePath">Path to .sdc file:</label>
  <div class="input-group">
    <input 
      #filePathInput
      type="text" 
      id="filePath" 
      placeholder="d:/data/seismic.sdc"
      (keydown.enter)="onSubmit(filePathInput.value)">
    <button (click)="onSubmit(filePathInput.value)">Open</button>
  </div>
  <small>Example: d:/Users/data/volume.sdc</small>
</div>
