<div class="trace-view">
  <h2>Trace Viewer (2D)</h2>
  
  <div class="controls">
    <div class="control-group">
      <label>Trace Range:</label>
      <input type="number" [(ngModel)]="traceStart" placeholder="0" min="0">
      <input type="number" [(ngModel)]="traceCount" placeholder="10" min="1" max="1000" value="50">
    </div>

    <div class="control-group">
      <label>Sample Range:</label>
      <input type="number" [(ngModel)]="sampleStart" placeholder="0" min="0">
      <input type="number" [(ngModel)]="sampleCount" placeholder="all" min="1">
    </div>

    <button (click)="loadSlice()" [disabled]="loading">
      {{ loading ? 'Loading...' : 'Load' }}
    </button>
  </div>

  <ng-container *ngIf="error">
    <div class="error">{{ error }}</div>
  </ng-container>

  <ng-container *ngIf="sliceData && !loading">
    <div class="canvas-container">
      <canvas #heatmapCanvas></canvas>
    </div>
    
    <div class="info">
      <p>Traces: {{ sliceData.traceStart }}-{{ sliceData.traceStart + sliceData.traceCount }}</p>
      <p>Samples: {{ sliceData.sampleStart }}-{{ sliceData.sampleStart + sliceData.sampleCount }}</p>
    </div>
  </ng-container>
</div>
