<div class="compress-tab">

  <!-- File -->
  <div>
    <p class="section-label">SEG-Y source</p>
    <app-file-selector extension="sgy" (fileSelected)="onSgySelected($event)"></app-file-selector>
  </div>

  <!-- Profile + 3D -->
  <div>
    <p class="section-label">Compression profile</p>
    <div class="options-row">
      <mat-button-toggle-group [(value)]="selectedProfile" aria-label="Profile">
        <mat-button-toggle value="high_quality">High Quality</mat-button-toggle>
        <mat-button-toggle value="balanced">Balanced</mat-button-toggle>
        <mat-button-toggle value="high_compression">Max Compression</mat-button-toggle>
      </mat-button-toggle-group>
      <mat-checkbox [(ngModel)]="is3D">3D volume</mat-checkbox>
    </div>
  </div>

  <!-- Action -->
  <div class="submit-row">
    <button mat-raised-button color="primary"
            [disabled]="!selectedSgy || submitting"
            (click)="submit()">
      <mat-icon>{{ submitting ? 'hourglass_empty' : 'bolt' }}</mat-icon>
      {{ submitting ? 'Compressing…' : 'Compress' }}
    </button>
  </div>

  <!-- Progress -->
  <div *ngIf="submitting" class="progress-bar-wrap">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>

  <!-- Result -->
  <div *ngIf="result" class="result-card">
    <div class="result-card__header">
      <mat-icon>check_circle</mat-icon>
      Compression complete
    </div>
    <div class="result-card__metrics">
      <div class="result-card__metric">
        <label>Ratio</label>
        <span>{{ result.ratio | number:'1.2-2' }}×</span>
      </div>
      <div class="result-card__metric">
        <label>Avg PSNR</label>
        <span>{{ result.psnrMean | number:'1.1-1' }} dB</span>
      </div>
      <div class="result-card__metric">
        <label>Eff. Bits</label>
        <span>{{ result.effectiveBits }}</span>
      </div>
      <div class="result-card__metric">
        <label>Time</label>
        <span>{{ elapsedMs }}ms</span>
      </div>
    </div>
    <div class="result-card__actions">
      <button class="view-result-btn" (click)="viewResultClicked()">
        <mat-icon>visibility</mat-icon>
        View in Viewer
      </button>
    </div>
  </div>

  <!-- Error -->
  <app-error-display [error]="appError" (retry)="onRetry()"></app-error-display>

</div>
